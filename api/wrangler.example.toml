name = "gtp-eco-api"
main = "worker.js"
compatibility_date = "2026-10-23"

[vars]
FRONTEND_ORIGIN = "https://loxlyatkinson.github.io"
FRONTEND_REPORT_URL = "https://loxlyatkinson.github.io/gtp-eco-workshop/tool/report/"
DATA_COLLECTION_ENABLED = "false"
NOTICE_VERSION = "pending-owner-review"
RETENTION_DAYS = "30"

[[d1_databases]]
binding = "DB"
database_name = "gtp-eco"
database_id = "REPLACE_WITH_D1_ID"

[triggers]
crons = ["0 3 * * *"]
